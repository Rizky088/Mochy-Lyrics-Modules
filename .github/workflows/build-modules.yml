name: Build Mochy Lyrics Modules

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing keystore (optional - matches Mochy Ext if set)
        env:
          CUSTOM_KEYSTORE_BASE64: ${{ secrets.CUSTOM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CUSTOM_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$CUSTOM_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build Module APKs
        run: gradle :megalobiz:assembleRelease :petitlyrics:assembleRelease --no-daemon --stacktrace

      - name: Package Installable Module ZIPs
        run: |
          mkdir -p dist/megalobiz dist/petitlyrics
          cp packaging/megalobiz/manifest.json packaging/megalobiz/icon.png dist/megalobiz/
          cp megalobiz/build/outputs/apk/release/*.apk dist/megalobiz/module.apk
          (cd dist/megalobiz && zip -r ../megalobiz-lyrics.zip .)

          cp packaging/petitlyrics/manifest.json packaging/petitlyrics/icon.png dist/petitlyrics/
          cp petitlyrics/build/outputs/apk/release/*.apk dist/petitlyrics/module.apk
          (cd dist/petitlyrics && zip -r ../petitlyrics.zip .)
          ls -lh dist/*.zip

      - name: Upload Module ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: mochy-lyrics-modules-zips
          path: dist/*.zip
          retention-days: 30
